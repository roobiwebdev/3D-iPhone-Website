<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/assets/images/apple.svg" />

    <title>Apple iPhone</title>

  <body class="relative bg-black">

        <div class="loader"></div>
      </div>
    </div>
